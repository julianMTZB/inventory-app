{% extends "base.html" %}
{% block title %}Nuevo producto{% endblock %}
{% block content %}
  <h1>Nuevo producto</h1>
  <p class="lead">El SKU se asigna solo al guardar.</p>

  <form method="post" class="stack">
    <label class="field" for="name">
      <span>Nombre</span>
      <input id="name" name="name" type="text" value="{{ form.name }}" required autofocus autocomplete="off">
    </label>
    <label class="field" for="price">
      <span>Precio</span>
      <input id="price" name="price" type="number" step="0.01" min="0.01" value="{{ form.price }}" required>
    </label>
    <label class="field" for="stock">
      <span>Stock inicial</span>
      <input id="stock" name="stock" type="number" step="1" min="0" value="{{ form.stock }}" required>
    </label>
    <div class="actions">
      <button type="submit">Crear producto</button>
      <a class="button button-quiet" href="{{ url_for('index') }}">Cancelar</a>
    </div>
  </form>
{% endblock %}
