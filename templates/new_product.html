{% extends "base.html" %}
{% block title %}Nuevo producto{% endblock %}
{% block content %}
  <section class="hero">
    <div>
      <h1>Nuevo producto</h1>
      <p class="lead">Define un código único para identificar el producto.</p>
    </div>
  </section>

  <div class="form-layout">
    <form method="post" class="stack">
      <label class="field" for="sku">
        <span>SKU</span>
        <span class="input-icon">{{ icon('tag') }}<input id="sku" name="sku" type="text" value="{{ form.sku }}" required autofocus autocomplete="off" maxlength="32" pattern="[A-Za-z0-9._\-]+"></span>
      </label>
      <label class="field" for="name">
        <span>Nombre</span>
        <span class="input-icon">{{ icon('package') }}<input id="name" name="name" type="text" value="{{ form.name }}" required autocomplete="off"></span>
      </label>
      <label class="field" for="price">
        <span>Precio</span>
        <span class="input-icon">{{ icon('dollar') }}<input id="price" name="price" type="number" step="0.01" min="0.01" value="{{ form.price }}" required></span>
      </label>
      <label class="field" for="stock">
        <span>Stock inicial</span>
        <span class="input-icon">{{ icon('layers') }}<input id="stock" name="stock" type="number" step="1" min="0" value="{{ form.stock }}" required></span>
      </label>
      <div class="actions">
        <button type="submit">{{ icon('plus') }}Crear producto</button>
        <a class="button button-quiet" href="{{ url_for('index') }}">Cancelar</a>
      </div>
    </form>
    <div class="hero-art" aria-hidden="true">{% include "_boxes.html" %}</div>
  </div>
{% endblock %}
