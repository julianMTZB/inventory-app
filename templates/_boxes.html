{# Ilustración decorativa: pila isométrica de cajas. Se incluye una sola vez por página. #}
<svg class="boxes" viewBox="30 40 240 190" role="img" aria-label="Pila de cajas de almacén">
  <defs>
    <symbol id="cube" viewBox="0 0 100 100" overflow="visible">
      <polygon points="50,0 100,25 50,50 0,25" style="fill:var(--t,#232e3c)"/>
      <polygon points="0,25 50,50 50,100 0,75" style="fill:var(--l,#18212c)"/>
      <polygon points="100,25 50,50 50,100 100,75" style="fill:var(--r,#1e2834)"/>
      <path d="M0 25 50 50 100 25M50 50v50" fill="none" stroke="#0b1016" stroke-width="1.2" stroke-opacity=".7"/>
    </symbol>
  </defs>
  <use href="#cube" x="100" y="100" width="100" height="100"/>
  <use href="#cube" x="100" y="50" width="100" height="100" style="--t:#f5a524;--l:#b97a0f;--r:#d88f14"/>
  <use href="#cube" x="50" y="125" width="100" height="100"/>
  <use href="#cube" x="150" y="125" width="100" height="100"/>
</svg>
